<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GSO Thrive — Offline</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem 1.5rem;
      background: #111111;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .brand { display: flex; align-items: baseline; gap: 0.5rem; }
    .brand-gso { color: #ffb600; font-weight: 700; font-size: 1.6rem; letter-spacing: 0.02em; }
    .brand-thrive { color: #ffffff; font-weight: 500; font-size: 1rem; letter-spacing: 0.18em; }
    h1 { font-size: 1.25rem; margin: 1.5rem 0 0; }
    p { color: #a8a8a8; max-width: 24rem; line-height: 1.5; }
    button {
      background: #ffb600;
      color: #111111;
      border: 0;
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="brand">
    <span class="brand-gso">GSO</span>
    <span class="brand-thrive">THRIVE</span>
  </div>
  <h1>You're offline</h1>
  <p>This app needs a connection to sign in and load your information. Reconnect to Wi-Fi or cell data and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</body>
</html>
